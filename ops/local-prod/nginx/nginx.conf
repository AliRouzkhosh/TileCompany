events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep paths operationally useful without retaining query strings or
    # one-time values embedded in the current account URL families.
    map $uri $privacy_safe_path {
        default $uri;
        ~^/(?:en|fa)/accounts/reset/[^/]+/[^/]+/$ /[locale]/accounts/reset/[redacted]/[redacted]/;
        "~^/(?:en|fa)/accounts/login/sms/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/$" /[locale]/accounts/login/sms/[redacted]/;
        "~^/(?:en|fa)/accounts/login/sms/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/resend/$" /[locale]/accounts/login/sms/[redacted]/resend/;
        "~^/(?:en|fa)/accounts/register/sms/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/$" /[locale]/accounts/register/sms/[redacted]/;
        "~^/(?:en|fa)/accounts/register/sms/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/resend/$" /[locale]/accounts/register/sms/[redacted]/resend/;
        "~^/(?:en|fa)/accounts/profile/phone/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/$" /[locale]/accounts/profile/phone/[redacted]/;
        "~^/(?:en|fa)/accounts/profile/phone/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/resend/$" /[locale]/accounts/profile/phone/[redacted]/resend/;
    }

    log_format localprod '$remote_addr - $host "$request_method $privacy_safe_path $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log localprod;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    server_tokens off;
    client_max_body_size 32m;

    server {
        listen 80;
        listen [::]:80;
        server_name tilecompany.localhost localhost 127.0.0.1 [::1];

        # Listener-derived redirect; inbound forwarding headers are irrelevant.
        return 308 https://tilecompany.localhost$request_uri;
    }

    # Reject unknown TLS hosts before they can reach the Django application.
    # TLS still needs the local rehearsal certificate before HTTP host routing.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/certs/tilecompany.localhost.pem;
        ssl_certificate_key /etc/nginx/certs/tilecompany.localhost-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        access_log off;
        return 444;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name tilecompany.localhost localhost 127.0.0.1 [::1];

        ssl_certificate /etc/nginx/certs/tilecompany.localhost.pem;
        ssl_certificate_key /etc/nginx/certs/tilecompany.localhost-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /_nginx_health {
            access_log off;
            return 204;
        }

        location /static/ {
            alias /var/www/static/;
            access_log off;
            expires 1h;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Explicit anonymous storefront/editorial media allowlist.  There is
        # intentionally no catch-all /media/ route: support and refund
        # attachments remain behind authorized Django download views, while
        # inventory import sources use storage outside MEDIA_ROOT.
        location /media/products/ {
            alias /var/www/media/products/;
            access_log off;
            autoindex off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /media/storefront/homepage/ {
            alias /var/www/media/storefront/homepage/;
            access_log off;
            autoindex off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /media/storefront/categories/ {
            alias /var/www/media/storefront/categories/;
            access_log off;
            autoindex off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /media/storefront/discovery/ {
            alias /var/www/media/storefront/discovery/;
            access_log off;
            autoindex off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Published article covers and the PDF resources linked from public
        # article detail pages share this prefix.
        location /media/blog/ {
            alias /var/www/media/blog/;
            access_log off;
            autoindex off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
        }
    }
}
