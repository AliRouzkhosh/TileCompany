events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format localprod '$remote_addr - $host "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log localprod;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    server_tokens off;
    client_max_body_size 32m;

    server {
        listen 80;
        listen [::]:80;
        server_name tilecompany.localhost localhost 127.0.0.1 [::1];

        # Listener-derived redirect; inbound forwarding headers are irrelevant.
        return 308 https://tilecompany.localhost$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name tilecompany.localhost;

        ssl_certificate /etc/nginx/certs/tilecompany.localhost.pem;
        ssl_certificate_key /etc/nginx/certs/tilecompany.localhost-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /_nginx_health {
            access_log off;
            return 204;
        }

        location /static/ {
            alias /var/www/static/;
            access_log off;
            expires 1h;
        }

        # Explicit anonymous storefront/editorial media allowlist.  There is
        # intentionally no catch-all /media/ route: support and refund
        # attachments remain behind authorized Django download views, while
        # inventory import sources use storage outside MEDIA_ROOT.
        location /media/products/ {
            alias /var/www/media/products/;
            access_log off;
            autoindex off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /media/storefront/homepage/ {
            alias /var/www/media/storefront/homepage/;
            access_log off;
            autoindex off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /media/storefront/categories/ {
            alias /var/www/media/storefront/categories/;
            access_log off;
            autoindex off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /media/storefront/discovery/ {
            alias /var/www/media/storefront/discovery/;
            access_log off;
            autoindex off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Published article covers and the PDF resources linked from public
        # article detail pages share this prefix.
        location /media/blog/ {
            alias /var/www/media/blog/;
            access_log off;
            autoindex off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
        }
    }
}
