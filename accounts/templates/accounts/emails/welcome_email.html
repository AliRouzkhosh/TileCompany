{% load i18n %}<html dir="{% get_current_language as LANGUAGE_CODE %}{% if LANGUAGE_CODE == 'fa' %}rtl{% else %}ltr{% endif %}"><body style="margin:0;background:#f7f7f6;color:#27272a;font-family:Arial,sans-serif;line-height:1.6"><main style="max-width:620px;margin:24px auto;padding:32px;background:#fff;border:1px solid #e4e4e7"><h1 style="margin-top:0">{% trans "Welcome to TileStore" %}</h1><p>{% blocktrans with username=user.get_username %}Hello {{ username }}, your TileStore account has been created successfully.{% endblocktrans %}</p><p><a href="{{ account_url }}">{% trans "Go to your account" %}</a></p><p><a href="{{ support_url }}">{% trans "Get help" %}</a></p></main></body></html>
