<!-- accounts/components/account_header.html !-->
<header class="mb-6 max-w-3xl border-b border-border pb-4">

    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">

        <div>

            <p class="text-sm font-semibold text-brand">

                {{ eyebrow }}

            </p>

            <h1 class="mt-2 text-3xl font-semibold tracking-[-0.02em] text-text-primary">

                {{ title }}

            </h1>

            {% if description %}

                <p class="mt-3 max-w-2xl text-sm leading-6 text-text-secondary">

                    {{ description }}

                </p>

            {% endif %}

        </div>

        {% if action_url and action_label %}

            <div>

                <a href="{{ action_url }}" class="sf-button sf-button--primary min-h-11">

                    {{ action_label }}

                </a>

            </div>

        {% endif %}

    </div>

</header>
