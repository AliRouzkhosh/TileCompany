{% load i18n %}
<div class="min-w-0">
    <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-semibold text-text-primary">
        {{ field.label }}{% if field.field.required %}<span class="text-error" aria-hidden="true"> *</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<div class="mt-2 text-xs leading-5 text-text-muted">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<ul class="mt-2 space-y-1 text-sm font-medium text-error" id="{{ field.id_for_label }}-errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
