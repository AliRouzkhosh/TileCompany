<!-- support/components/support_topic_card.html -->
{% load i18n %}

<div class="group rounded-2xl border border-gray-200 bg-white p-6 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-emerald-300 hover:shadow-lg">

    <!-- ========================================== -->
    <!-- Icon                                       -->
    <!-- ========================================== -->

    <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-100">

        <i
            data-lucide="{{ icon|default:'book-open' }}"
            class="h-7 w-7 text-emerald-600"
        ></i>

    </div>

    <!-- ========================================== -->
    <!-- Content                                    -->
    <!-- ========================================== -->

    <h3 class="mt-6 text-lg font-semibold text-gray-900 transition group-hover:text-emerald-600">

        {{ title }}

    </h3>

    <p class="mt-3 text-sm leading-6 text-gray-600">

        {{ description }}

    </p>

    <!-- ========================================== -->
    <!-- Footer                                     -->
    <!-- ========================================== -->

    <div class="mt-6 inline-flex items-center gap-2 text-sm font-medium text-emerald-600">

        {% trans "Coming soon" %}

        <i
            data-lucide="arrow-right"
            class="h-4 w-4"
        ></i>

    </div>

</div>
