<!-- support/components/support_hero.html -->
{% load i18n %}

<section class="overflow-hidden rounded-3xl bg-gradient-to-r from-emerald-600 to-emerald-700 shadow-lg">

    <div class="px-8 py-14 text-center text-white">

        <!-- ========================================== -->
        <!-- Heading                                    -->
        <!-- ========================================== -->

        <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">
            {% trans "How can we help?" %}
        </h1>

        <p class="mx-auto mt-5 max-w-2xl text-lg text-emerald-100">
            {% blocktrans %}Find answers to common questions, manage your support tickets, or contact our team for personalized assistance.{% endblocktrans %}
        </p>

        <!-- ========================================== -->
        <!-- Search (Coming Soon)                       -->
        <!-- ========================================== -->

        <div class="mx-auto mt-10 max-w-2xl">

            <div class="relative">

                <i
                    data-lucide="search"
                    class="absolute start-5 top-1/2 h-5 w-5 -translate-y-1/2 text-emerald-200"
                ></i>

                <input
                    type="search"
                    placeholder="{% trans 'Search our Help Center (coming soon)' %}"
                    aria-label="{% trans 'Search our Help Center (coming soon)' %}"
                    disabled
                    class="w-full cursor-not-allowed rounded-2xl border border-white/20 bg-white/10 py-4 ps-14 pe-5 text-white placeholder:text-emerald-100 backdrop-blur focus:outline-none"
                >

            </div>

            <p class="mt-3 text-sm text-emerald-100">
                {% trans "Knowledge Base and Help Center search will be available soon." %}
            </p>

        </div>

    </div>

</section>
