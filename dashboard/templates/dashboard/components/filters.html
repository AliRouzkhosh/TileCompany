{% load i18n %}

<div class="rounded-2xl bg-white p-5 shadow-sm">
    <form method="get" class="grid gap-4 lg:grid-cols-2 xl:grid-cols-4">
        <input
            type="text"
            name="search"
            value="{{ search }}"
            placeholder="{% trans 'Search by order number, customer, phone, or payment reference...' %}"
            class="rounded-xl border border-stone-300 px-4 py-2 focus:border-indigo-500 focus:outline-none"
        >

        <select name="status" class="rounded-xl border border-stone-300 px-4 py-2">
            <option value="">{% trans "All statuses" %}</option>
            <option value="pending" {% if status == "pending" %}selected{% endif %}>{% trans "Pending" %}</option>
            <option value="confirmed" {% if status == "confirmed" %}selected{% endif %}>{% trans "Confirmed" %}</option>
            <option value="on_hold" {% if status == "on_hold" %}selected{% endif %}>{% trans "On Hold" %}</option>
            <option value="shipped" {% if status == "shipped" %}selected{% endif %}>{% trans "Shipped" %}</option>
            <option value="delivered" {% if status == "delivered" %}selected{% endif %}>{% trans "Delivered" %}</option>
            <option value="cancelled" {% if status == "cancelled" %}selected{% endif %}>{% trans "Cancelled" %}</option>
        </select>

        <select name="payment" class="rounded-xl border border-stone-300 px-4 py-2">
            <option value="">{% trans "All payments" %}</option>
            <option value="paid" {% if payment == "paid" %}selected{% endif %}>{% trans "Paid" %}</option>
            <option value="unpaid" {% if payment == "unpaid" %}selected{% endif %}>{% trans "Unpaid" %}</option>
        </select>

        <div class="flex gap-3">
            <button class="flex-1 rounded-xl bg-indigo-600 px-6 py-2 font-medium text-white">
                {% trans "Apply" %}
            </button>
            <a href="?" class="flex items-center justify-center rounded-xl border border-stone-300 px-5 py-2">
                {% trans "Clear" %}
            </a>
        </div>
    </form>
</div>
