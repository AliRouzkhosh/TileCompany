{% load localized_dates %}
<div class="rounded-2xl bg-white p-6 shadow-sm">

    <div class="mb-5 flex items-center justify-between">

        <h2 class="text-lg font-semibold">
            Recent Orders
        </h2>

        <a
            href="{% url 'dashboard:all_orders' %}"
            class="text-sm text-indigo-600 hover:underline"
        >
            View All
        </a>

    </div>

    <div class="space-y-3">

        {% for order in recent_orders %}

        <div class="flex items-center justify-between rounded-xl border border-stone-200 p-3">

            <div>

                <p class="font-medium">

                    #{{ order.user_order_number }}

                </p>

                <p class="text-sm text-stone-500">

                    {{ order.user.username }}

                </p>

            </div>

            <div class="text-right">

                <p class="font-semibold">

                    {{ order.total_amount }}

                </p>

                <p class="text-xs text-stone-500">

                    {{ order.created_at|localized_datetime }}

                </p>

            </div>

        </div>

        {% empty %}

        <p class="text-sm text-stone-500">

            No recent orders.

        </p>

        {% endfor %}

    </div>

</div>
