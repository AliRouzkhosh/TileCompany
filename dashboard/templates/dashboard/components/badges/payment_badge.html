{% load i18n %}
{% if order.is_paid %}

<span class="inline-flex rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-700">
    {% trans "Paid" %}
</span>

{% else %}

<span class="inline-flex rounded-full bg-red-100 px-3 py-1 text-xs font-semibold text-red-700">
    {% trans "Unpaid" %}
</span>

{% endif %}
