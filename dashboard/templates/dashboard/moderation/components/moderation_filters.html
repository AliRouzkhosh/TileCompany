<!-- dashboard/moderation/components/moderation_filters.html -->
{% load i18n %}

<form method="get"
      class="mb-8 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">

    <div class="grid gap-4 lg:grid-cols-4">

        <!-- Search -->

        <div>

            <label class="mb-2 block text-sm font-medium text-slate-700">

                {% trans "Search" %}

            </label>

            <input
                type="text"
                name="search"
                value="{{ search }}"
                placeholder="{% trans 'Author, email...' %}"
                class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-emerald-500 focus:ring-emerald-500">

        </div>

        <!-- Date -->

        <div>

            <label class="mb-2 block text-sm font-medium text-slate-700">

                {% trans "Sort" %}

            </label>

            <select
                name="sort"
                class="w-full rounded-xl border border-slate-300 px-4 py-2">

                <option value="">{% trans "Oldest First" %}</option>

                <option value="-created_at"
                        {% if sort == "-created_at" %}selected{% endif %}>

                    {% trans "Newest First" %}

                </option>

            </select>

        </div>

        <!-- Empty -->

        <div></div>

        <!-- Buttons -->

        <div class="flex items-end justify-end gap-3">

            <a
                href="?"
                class="rounded-xl border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100">

                {% trans "Clear" %}

            </a>

            <button
                type="submit"
                class="rounded-xl bg-emerald-600 px-5 py-2 text-sm font-medium text-white hover:bg-emerald-700">

                {% trans "Apply Filters" %}

            </button>

        </div>

    </div>

</form>
