{% load i18n localized_content %}
<section
    class="min-w-0"
    aria-label="{% trans 'Product gallery' %}"
    data-product-gallery
    data-product-name="{{ product|localized:"name" }}"
    data-image-label="{% trans 'View image' %}">
    <div
        id="mainImage"
        class="relative aspect-[4/3] overflow-hidden rounded-feature border border-border bg-surface-subtle shadow-surface"
        data-gallery-main>
        {% if initial_gallery_images %}
            <img
                src="{{ initial_gallery_images.0 }}"
                alt="{{ product|localized:"name" }}"
                class="h-full w-full object-contain transition-opacity duration-200"
                data-gallery-main-image>
        {% else %}
            <div class="home-media-fallback flex h-full w-full flex-col items-center justify-center gap-3 text-text-muted" data-gallery-fallback>
                <svg class="h-20 w-20 opacity-40" aria-hidden="true" fill="none" viewBox="0 0 96 96" stroke="currentColor">
                    <path stroke-width="1.75" d="M12 12h32v32H12zM52 12h32v32H52zM12 52h32v32H12zM52 52h32v32H52z"/>
                </svg>
                <span class="text-sm">{% trans "No image available" %}</span>
            </div>
        {% endif %}

        {% include "products/components/product_badges.html" with product=product %}
    </div>

    <div
        id="productThumbnails"
        class="mt-3 flex max-w-full gap-3 overflow-x-auto px-0.5 py-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden{% if initial_gallery_images|length < 2 %} hidden{% endif %}"
        role="group"
        aria-label="{% trans 'Product images' %}"
        tabindex="-1"
        data-gallery-thumbnails>
        {% for image_url in initial_gallery_images %}
            <button
                type="button"
                class="gallery-thumb group h-16 w-16 shrink-0 overflow-hidden rounded-control border border-border-strong bg-surface-subtle p-0.5 transition hover:border-brand-mid focus-visible:outline-none aria-[current=true]:border-brand aria-[current=true]:ring-2 aria-[current=true]:ring-brand/25"
                data-full="{{ image_url }}"
                aria-label="{% trans 'View image' %} {{ forloop.counter }}"
                aria-current="{% if forloop.first %}true{% else %}false{% endif %}">
                <img src="{{ image_url }}" alt="" class="h-full w-full rounded-[0.6rem] object-cover" aria-hidden="true">
            </button>
        {% endfor %}
    </div>
</section>
