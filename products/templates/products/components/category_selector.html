{% load i18n localized_content %}
<section class="catalog-category-selector" aria-labelledby="catalog-category-selector-title" data-catalog-category-selector>
    <h2 id="catalog-category-selector-title" class="catalog-category-selector-title">{% trans "Shop by category" %}</h2>
    <nav class="catalog-category-selector-grid" aria-label="{% trans 'Shop by category' %}">
        {% for item in category_selector_items %}
        <a href="{{ item.url }}"
           class="catalog-category-selector-link{% if item.active %} is-active{% endif %}"
           {% if item.active %}aria-current="page"{% endif %}>
            <span class="catalog-category-selector-media{% if not item.category %} catalog-category-selector-media--all{% endif %}" aria-hidden="true">
                {% if item.category and item.category.storefront_image %}
                <img src="{{ item.category.storefront_image.url }}" alt="" loading="lazy" decoding="async">
                {% else %}
                <span class="catalog-category-selector-media-fallback"></span>
                {% endif %}
            </span>
            <span class="catalog-category-selector-label">{% if item.category %}{{ item.category|localized:"name" }}{% else %}{{ item.label }}{% endif %}</span>
            <svg class="catalog-category-selector-cue directional-icon" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="m9 18 6-6-6-6"/>
            </svg>
        </a>
        {% endfor %}
    </nav>
</section>
