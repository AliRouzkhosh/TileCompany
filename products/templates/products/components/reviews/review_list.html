{% load i18n %}
<div id="review-list" class="space-y-4 sm:space-y-5" data-review-list>
    {% if reviews %}
        {% for review in reviews %}
            {% include "products/components/reviews/review_card.html" with review=review %}
        {% endfor %}
    {% else %}
        <div id="empty-review-state" class="border-t border-border py-8 sm:py-10" data-reviews-empty>
            <svg class="h-8 w-8 text-text-muted" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M21 12a8 8 0 0 1-8 8 9.3 9.3 0 0 1-4-.9L3 21l1.9-5A8 8 0 1 1 21 12Z"/></svg>
            <h3 class="mt-3 text-base font-semibold text-text-primary">{% trans "No reviews yet" %}</h3>
            <p class="mt-1 text-sm text-text-muted">{% trans "Be the first to review this product." %}</p>
        </div>
    {% endif %}
</div>

<div id="review-message" class="mt-5 hidden rounded-control border border-success/30 bg-success/10 px-4 py-3 text-sm text-success"></div>
