{% load i18n %}
<form method="post" action="{% url 'products:add_comment' review.id %}" class="comment-form rounded-control border border-border bg-surface-subtle p-4" hx-post="{% url 'products:add_comment' review.id %}" hx-target="#product-reviews-region" hx-swap="outerHTML">
    {% csrf_token %}
    <label class="block text-sm font-medium text-text-secondary">
        <span class="mb-1.5 block">{% trans "Your reply" %}</span>
        <textarea name="comment" rows="3" placeholder="{% trans 'Share your thoughts...' %}" required class="w-full rounded-control border border-border-strong bg-surface px-3 py-2.5 text-text-primary focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/25"></textarea>
    </label>
    <div class="mt-3 flex flex-wrap items-center gap-3">
        <button type="submit" class="sf-button sf-button--primary min-h-11 px-4 py-2 text-sm">{% trans "Post reply" %}</button>
        <button type="button" class="comment-cancel sf-button sf-button--secondary min-h-11 px-4 py-2 text-sm">{% trans "Cancel" %}</button>
    </div>
</form>
