<div class="rounded-2xl border border-stone-200 bg-white p-6">

    <h2 class="text-lg font-semibold text-stone-900">
        {% trans "Need help?" context "order support" %}

    <p class="mt-3 text-sm text-stone-600">

        {% trans "Have questions about this order, shipping, payment, or returns? Our support team is here to help." context "order support" %}

    <a href="#"

        {% trans "Contact support" context "order support" %}

    </a>


</div>
