{% load i18n %}
{% if related_articles %}<section aria-labelledby="continue-reading-heading"><div class="flex items-end justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-[0.14em] text-brand-active">{% trans "Continue reading" %}</p><h2 id="continue-reading-heading" class="mt-1 text-2xl font-semibold text-text-primary sm:text-3xl">{% trans "More to explore" %}</h2></div><a href="{% url 'blog:article_list' %}" class="hidden min-h-11 items-center text-sm font-semibold text-brand-active hover:underline sm:inline-flex">{% trans "View all articles" %}</a></div><div class="mt-5 grid gap-3 md:grid-cols-3 md:gap-5">{% for article in related_articles %}{% include "blog/components/related_article_card.html" with article=article %}{% endfor %}</div></section>{% endif %}
