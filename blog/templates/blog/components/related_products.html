{% load i18n %}
{% if related_products %}<section class="overflow-hidden rounded-[1.5rem] border border-brand-mid bg-brand-subtle px-4 py-6 sm:px-7 sm:py-8" aria-labelledby="article-products-heading"><div class="max-w-2xl"><p class="text-xs font-bold uppercase tracking-[0.14em] text-brand-active">{% trans "Products mentioned" %}</p><h2 id="article-products-heading" class="mt-1 text-2xl font-semibold text-text-primary sm:text-3xl">{% trans "Products related to this article" %}</h2></div><div class="mt-5 grid gap-3 {% if related_products|length == 1 %}md:mx-auto md:max-w-xl{% else %}md:grid-cols-2{% endif %} {% if related_products|length > 2 %}xl:grid-cols-3{% endif %}">{% for product in related_products %}{% include "products/components/product_card.html" with product=product card_mode="article" %}{% endfor %}</div></section>{% endif %}
