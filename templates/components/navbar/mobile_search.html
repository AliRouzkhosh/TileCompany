{% load i18n %}
<div class="mobile-search-layer lg:hidden" data-mobile-search-layer aria-hidden="true" inert>
    <div class="mobile-overlay-backdrop" data-mobile-search-backdrop></div>
    <section id="mobileSearchPanel" class="mobile-search-panel" role="dialog" aria-modal="true" aria-labelledby="mobileSearchTitle" tabindex="-1" data-mobile-search-panel>
        <div class="flex items-center justify-between gap-4 border-b border-border px-4 py-3">
            <h2 id="mobileSearchTitle" class="font-semibold text-text-primary">{% trans "Search products" %}</h2>
            <button type="button" class="sf-icon-button" data-mobile-search-close aria-label="{% trans 'Close search' %}"><i data-lucide="x" class="sf-icon" aria-hidden="true"></i></button>
        </div>
        <div class="px-4 py-4 sm:px-6">
            {% include "components/navbar/searchbar.html" with search_id="mobileHeaderSearch" %}
        </div>
    </section>
</div>
