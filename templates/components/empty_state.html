<div class="mx-auto flex max-w-2xl flex-col items-center justify-center rounded-2xl border border-dashed border-stone-300 bg-stone-50 px-8 py-20 text-center">

    <!-- Icon -->
    <div class="flex h-20 w-20 items-center justify-center rounded-full bg-white shadow-sm">

        {% if icon == "cart" %}

            <svg class="h-10 w-10 text-stone-400"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 viewBox="0 0 24 24">

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 6h13M10 21a1 1 0 100-2 1 1 0 000 2zm8 0a1 1 0 100-2 1 1 0 000 2"/>

            </svg>

        {% elif icon == "orders" %}

            <svg class="h-10 w-10 text-stone-400"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 viewBox="0 0 24 24">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M9 12h6M9 16h6M5 4h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/>

            </svg>

        {% elif icon == "wishlist" %}

            <svg class="h-10 w-10 text-stone-400"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 viewBox="0 0 24 24">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 116.364 6.364L12 20.364 4.318 12.682a4.5 4.5 0 010-6.364z"/>

            </svg>

        {% endif %}

    </div>

    <!-- Title -->
    <h2 class="mt-8 text-3xl font-bold tracking-tight text-stone-900">
        {{ title }}
    </h2>

    <!-- Description -->
    <p class="mt-4 max-w-lg text-stone-600">
        {{ description }}
    </p>

    <!-- Buttons -->
    <div class="mt-10 flex flex-col gap-4 sm:flex-row">

        {% if primary_url %}
            <a
                href="{{ primary_url }}"
                class="inline-flex items-center justify-center rounded-xl bg-amber-700 px-6 py-3 text-sm font-semibold text-white transition hover:bg-amber-800"
            >
                {{ primary_text }}
            </a>
        {% endif %}

        {% if secondary_url %}
            <a
                href="{{ secondary_url }}"
                class="inline-flex items-center justify-center rounded-xl border border-stone-300 bg-white px-6 py-3 text-sm font-medium text-stone-700 transition hover:bg-stone-100"
            >
                {{ secondary_text }}
            </a>
        {% endif %}

    </div>

</div>
